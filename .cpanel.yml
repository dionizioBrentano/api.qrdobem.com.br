---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/api.qrdobem.com.br
    # Código da aplicação
    - /bin/cp -R app $DEPLOYPATH/
    - /bin/cp -R bootstrap $DEPLOYPATH/
    - /bin/cp -R config $DEPLOYPATH/
    - /bin/cp -R database $DEPLOYPATH/
    - /bin/cp -R public $DEPLOYPATH/
    - /bin/cp -R resources $DEPLOYPATH/
    - /bin/cp -R routes $DEPLOYPATH/
    - /bin/cp artisan $DEPLOYPATH/
    - /bin/cp composer.json $DEPLOYPATH/
    - /bin/cp composer.lock $DEPLOYPATH/
    # Limpa caches para o Laravel enxergar rotas e config novas
    - cd $DEPLOYPATH && /usr/local/bin/php artisan config:clear
    - cd $DEPLOYPATH && /usr/local/bin/php artisan route:clear
    - cd $DEPLOYPATH && /usr/local/bin/php artisan config:cache
    - cd $DEPLOYPATH && /usr/local/bin/php artisan route:cache

# NÃO copiado de propósito:
#   .env       → vive só no servidor, contém senhas
#   vendor/    → gerado por composer install, não versionado
#   storage/   → logs, cache e uploads do servidor não podem ser sobrescritos
#
# Depois de adicionar dependência nova no composer.json, rode uma vez via SSH:
#   cd ~/api.qrdobem.com.br && composer install --no-dev -o
#
# Se o caminho do PHP acima não existir, descubra com:  which php
